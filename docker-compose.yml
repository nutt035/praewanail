services:
  # --- Antonette Nail ---
  antonette-nail:
    build:
      context: ./antonette_nail
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_LINE_LIFF_ID: ${NEXT_PUBLIC_LINE_LIFF_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: antonette-nail
    restart: always
    environment:
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private_uploads
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_LINE_LIFF_ID: ${NEXT_PUBLIC_LINE_LIFF_ID}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_ADMIN_USER_IDS: ${LINE_ADMIN_USER_IDS}
      SLIPOK_API_KEY: ${SLIPOK_API_KEY}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OFFICE_ENABLED: ${OFFICE_ENABLED:-false}
      LEGACY_ADMIN_AUTH_ENABLED: ${LEGACY_ADMIN_AUTH_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./uploads:/app/uploads
      - ./private_uploads:/app/private_uploads
    networks:
      - web-network

  nginx-antonette:
    image: nginx:alpine
    container_name: nginx-antonette
    volumes:
      - ./antonette_nail/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - antonette-nail
    restart: always
    networks:
      - web-network

  # --- Internship Report ---
  internship-report:
    build:
      context: ./internship-report
      dockerfile: Dockerfile
    container_name: internship-report
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env
    networks:
      - web-network

  # --- Cloudflare Tunnel ---
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx-antonette
      - internship-report
    networks:
      - web-network

  # --- Cron Jobs (สะกิด API ตามเวลา) ---
  cron-jobs:
    image: alpine:latest
    container_name: cron-jobs
    restart: always
    environment:
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      - antonette-nail
    command: >
      sh -c "apk add --no-cache curl && echo '*/15 * * * * curl -s -H \"Authorization: Bearer $${CRON_SECRET}\" http://antonette-nail:3000/api/cron/reminders' > /etc/crontabs/root && crond -f -l 8"
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
